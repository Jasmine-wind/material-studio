server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:studio}
    password: ${DB_PASSWORD:studio_local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
mybatis:
  configuration:
    map-underscore-to-camel-case: true
studio:
  storage: ${STORAGE_PATH:storage}
  demo-enabled: ${DEMO_ENABLED:true}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
